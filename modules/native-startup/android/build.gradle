plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.sayojeong.yougabell'
version = '1.0.0'

expoModule {
  // This module is bundled with the app and is never published to Maven.
  canBePublished false
}

android {
  namespace "com.sayojeong.yougabell.nativestartup"

  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}
